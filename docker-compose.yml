# Local stack: Postgres + TAES 2 (+ optional pgAdmin with `--profile admin`).
# Values come from .env (copy .env.example); POSTGRES_PASSWORD is required (and PGADMIN_PASSWORD for pgAdmin).
services:
  database:
    image: postgres:16-alpine
    container_name: taes2-database
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taes2_db}
      POSTGRES_USER: ${POSTGRES_USER:-taes2_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - taes2-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taes2-app:latest
    container_name: taes2-app
    ports:
      - "${TAES_SERVER_PORT:-7860}:7860"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taes2_db_user}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-taes2_db}
      TAES_INTERFACE_MODE: ${TAES_INTERFACE_MODE:-main}
      TAES_SERVER_NAME: 0.0.0.0
      TAES_SERVER_PORT: 7860
      TAES_DEBUG: "false"
    volumes:
      - app_logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - taes2-network

  # Optional: pgAdmin for database management (docker compose --profile admin up -d)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taes2-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy
    networks:
      - taes2-network
    profiles:
      - admin

volumes:
  postgres_data:
  pgadmin_data:
  app_logs:

networks:
  taes2-network:
    driver: bridge
